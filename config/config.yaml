# SQLatte Configuration
# Simple YAML config - no .env file needed!
# You can use environment variables with ${VAR:default} syntax if you want

# Application Settings
app:
  name: "SQLatte"
  version: "0.3.0"
  host: "0.0.0.0"
  port: 8000

# Analytics Database Configuration
analytics:
  enabled: false
  backend: "postgresql"
  postgresql:
    host: "localhost"
    port: 5432
    database: "sqlatte_analytics"
    user: "sqlatte"
    password: "sqlatte"
    
config_db:
  enabled: false
  type: postgresql  # veya sqlite

  postgresql:
    host: localhost
    database: sqlatte_config  # ⚠️ AYRI DATABASE!
    user: "sqlatte"
    password: "sqlatte"

  encryption_key: "******"

admin:
  enabled: true
  username: "admin"
  password: "admin!"
# ============================================
# AUTHENTICATION PLUGIN
# ============================================
plugins:
  auth:
    enabled: true
    session_ttl_minutes: 480  # 8 hours
    max_workers: 40  # Thread pool for concurrent users

    # Database Provider Configuration
    # Users will NOT see this - it's server-side only
    db_provider: "trino"  # Options: trino, postgresql, mysql
    db_host: "trino_hostname"
    db_port: 443

    
    # Catalog/Schema Restrictions
    # If empty lists, all catalogs/schemas are allowed
    # If filled, only these will be available in login form
    allowed_catalogs:
      - name: "hive"
        allowed_schemas: ["edr", "hive"]
      - name: "network"
        allowed_schemas: [ "cloudflare" ]
      - name: "mongo_stores_db"
        allowed_schemas: [ "mongo" ]

    # Database Type Restrictions
    allowed_db_types:
      - "trino"


# LLM Provider Configuration
llm:
  #provider: "gemini"  # Which LLM to use
  #provider: "vertexai"  # Which LLM to use
  provider: "anthropic"  # Which LLM to use
  
  # Anthropic Claude
  anthropic:
    # Option 1: Direct API key (simple)
    api_key: "sk-anthropic-api"

    
    # Option 2: From environment variable (secure)
    # api_key: "${ANTHROPIC_API_KEY}"
    
    model: "claude-sonnet-4-20250514"
    max_tokens: 1000

  gemini:
    # Option 1: Direct API key (simple)
    api_key: "sk-gemini-api"

    # Option 2: From environment variable (secure)
    # api_key: "${GEMINI_API_KEY}"

    # Available models:
    # - gemini-pro (recommended, free tier available)
    # - gemini-pro-vision (for image analysis)
    # - gemini-1.5-pro (latest version)
    model: "gemini-pro"
    max_tokens: 1000

  # Google Vertex AI (Enterprise)
  vertexai:
    # GCP Project ID (REQUIRED)
    project_id: "my-gcp-project-id"

    # Region/Location (REQUIRED)
    # Options: us-central1, europe-west1, asia-southeast1, etc.
    location: "europe-west1"

    # Model name
    # Options: gemini-pro, gemini-1.5-pro, gemini-1.5-flash
    model: "gemini-2.5-flash"
    #    model_routing:
    #      intent_detection: "gemini-2.5-flash"
    #      chat: "gemini-2.5-flash"
    #      sql: "gemini-2.5-pro"
    #      insights: "gemini-2.5-flash"

    # Token limit
    max_tokens: 1000

    # ========================================
    # AUTHENTICATION (3 yöntem var!)
    # ========================================

    # METHOD 1: Service Account JSON File Path (RECOMMENDED for local)
    # credentials_path: "/path/to/service-account-key.json"
    credentials_path: "/path/to/service-account-key.json"

    # METHOD 2: Service Account JSON Content (RECOMMENDED for containers)
    # JSON içeriğini direkt buraya yapıştır (string olarak)
    # credentials_json: '{"type": "service_account", "project_id": "...", ...}'

    # METHOD 3: Default Credentials (RECOMMENDED for GCP ortamları)
    # GCP üzerinde çalışıyorsan (Cloud Run, GKE, Compute Engine)
    # Bu durumda credentials_path ve credentials_json boş bırak
    # ADC (Application Default Credentials) otomatik kullanılır

    # Environment variable da kullanabilirsin:
    # credentials_path: "${GOOGLE_APPLICATION_CREDENTIALS}"

# Database Provider Configuration
database:
  #provider: "mysql"      # Distributed SQL engine
  #provider: "postgresql" # PostgreSQL database
  provider: "trino"  # Which database to use
  
  # Trino Configuration
  trino:
    # Direct values (simple)
    host: "trino.example.com"
    port: 443
    user: "username123"
    password: "***********"
    catalog: "hive"
    schema: "default"
    http_scheme: "https"
    
    # Or use environment variables (secure)
    # host: "${TRINO_HOST}"
    # port: "${TRINO_PORT:8443}"

# ============================================
  # POSTGRESQL Configuration
  # ============================================
  postgresql:
    # Direct configuration (simple)
    host: "host.docker.internal"
    port: 5432
    database: "database1"
    user: "Username1"
    password: "********"
    schema: "public"

    # Or use environment variables (secure)
    # host: "${POSTGRES_HOST:localhost}"
    # port: "${POSTGRES_PORT:5432}"
    # database: "${POSTGRES_DB:postgres}"
    # user: "${POSTGRES_USER:postgres}"
    # password: "${POSTGRES_PASSWORD}"
    # schema: "${POSTGRES_SCHEMA:public}"

    # Connection pool settings (optional)
    min_connections: 1
    max_connections: 10

  # ============================================
  # MYSQL Configuration
  # ============================================
  mysql:
    # Direct configuration (simple)
    host: "host.docker.internal"
    port: 3306
    database: "database1"
    user: "username1"
    password: "**********"

    # Or use environment variables (secure)
    # host: "${MYSQL_HOST:localhost}"
    # port: "${MYSQL_PORT:3306}"
    # database: "${MYSQL_DATABASE:mysql}"
    # user: "${MYSQL_USER:root}"
    # password: "${MYSQL_PASSWORD}"

    # MySQL specific settings (optional)
    #charset: "utf8mb4"
    #use_unicode: true
    autocommit: true
  # ============================================
  # BIGQUERY Configuration
  # ============================================
  bigquery:
    # GCP Project ID (REQUIRED)
    project_id: "my-gcp-project-id"

    # Dataset (OPTIONAL)
    # If empty, allows cross-dataset queries
    # If specified, simplifies table references (e.g., just "table_name" instead of "dataset.table_name")
    dataset: ""  # e.g., "analytics", "warehouse", etc.

    # Location (OPTIONAL)
    # Options: US, EU, asia-northeast1, us-central1, europe-west1, etc.
    location: "US"

    # ========================================
    # AUTHENTICATION (2 methods - choose ONE!)
    # ========================================

    # METHOD 1: Service Account JSON File Path (RECOMMENDED for local development)
    # credentials_path: "/path/to/service-account-key.json"
    credentials_path: ""

    # METHOD 2: Service Account JSON Content (RECOMMENDED for containers/CI/CD)
    # Paste the entire JSON content as a string
    # credentials_json: '{"type": "service_account", "project_id": "...", "private_key": "...", ...}'
    credentials_json: ""
    
    # Query timeout in seconds
    timeout: 300
    # Maximum rows to return (to prevent huge result sets)
    max_results: 10000
# CORS Settings
cors:
  allow_origins: ["*"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

# Query Settings
query:
  default_limit: 100
  max_limit: 1000
  timeout: 300

# Tips:
# 1. Edit values directly in this file (easiest)
# 2. Or use ${VAR} for environment variables
# 3. No .env file needed unless you want to use env vars


# ============================================
# SCHEDULED QUERIES & EMAIL REPORTS
# ============================================
scheduler:
  enabled: false                  # Enable scheduled queries feature
  timezone: "UTC"               # Default timezone for schedules
  max_concurrent_jobs: 10       # Max jobs running simultaneously
  job_timeout_seconds: 300      # Timeout for each job execution

  # Execution History
  keep_history_days: 30         # How long to keep execution logs
  max_executions_per_schedule: 100  # Max execution logs per schedule

# Email Configuration
email:
  enabled: false                # Set to true to enable email reports
  provider: "smtp"              # Currently only SMTP supported

  smtp:
    host: "smtp.gmail.com"
    port: 587
    user: "your-email@gmail.com"  # SMTP username
    password: "app-password"  # SMTP password (use app password for Gmail)
    from_email: "from-email-address@gmail.com"  # From email address
    from_name: "SQLatte Reports"       # From name

  # Email Templates
  templates:
    success_subject: "✅ {{schedule_name}} - {{date}}"
    failure_subject: "❌ Failed: {{schedule_name}}"

  # Rate Limiting
  max_emails_per_day: 1000      # Max emails per day
  max_recipients_per_email: 10  # Max recipients per email

# Export Configuration
export:
  formats:
    - csv
    - excel
    - html

  max_rows: 1000               # Max rows to export (prevent huge files)
  max_file_size_mb: 25          # Max attachment size

  # File naming
  filename_template: "{{schedule_name}}_{{date}}_{{time}}.{{format}}"

insights:
  enabled: false               # Başlangıçta kapalı
  mode: hybrid                 # llm_only, statistical_only, hybrid
  max_insights: 3
  include_statistical: true

# Semantic Layer Configuration
semantic_layers:
  enabled: false
  default_schema: "default"
  config_path: "config/semantic_layers.yaml"
  refresh_on_startup: true
  fail_on_validation_error: false

# ============================================
# PROMPTS CONFIGURATION
# ============================================
# These prompts control how SQLatte interacts with your data
# You can customize them via Admin Panel or directly here
prompts:
  # Intent Detection: Determines if question needs SQL or is chat
  intent_detection: |
    Analyze this user question and determine if it requires a SQL query or is general conversation.
    
    Available Tables Schema:
    {schema_info}
    
    User Question: {question}
    
    Rules:
    1. If question asks about data, analytics, or queries related to the available tables → intent: "sql"
    2. If question is greeting, general chat, help, or unrelated to tables → intent: "chat"
    3. If tables are not selected but question seems like SQL query → intent: "chat" (explain they need to select tables)
    
    Respond in this exact format:
    INTENT: sql or chat
    CONFIDENCE: 0.0 to 1.0
    REASONING: brief explanation

  # Barista Personality: Chat response personality
  barista_personality: |
    You are SQLatte ☕ - a friendly AI assistant that helps users query their databases with natural language.
    
    Your personality:
    - Helpful and friendly, like a barista serving the perfect drink
    - Knowledgeable about SQL and databases
    - Can have casual conversations too
    - Use coffee/brewing metaphors occasionally when appropriate
    
    When users ask general questions (not about data):
    - Respond naturally and helpfully
    - If they seem lost, guide them on how to use SQLatte
    - Be concise but friendly

  # SQL Generation: Natural language to SQL translation
  sql_generation: |
    You are a SQL expert. Generate a SQL query based on the user's question.
    
    Table Schema(s):
    {schema_info}
    
    User Question: {question}
    
    Rules:
    1. Generate ONLY valid SQL syntax for trino
    2. If multiple tables are provided, use appropriate JOINs
    3. Infer JOIN conditions from table relationships (common column names)
    4. Use table aliases for readability (e.g., orders o, customers c)
    5. Include LIMIT clause for safety (default 100 rows)
    6. For aggregations, use GROUP BY appropriately
    7. Use explicit JOIN syntax (INNER JOIN, LEFT JOIN, etc.)
    
    ⚡ PERFORMANCE OPTIMIZATION (CRITICAL):
    8. **PARTITION COLUMN**: If schema contains a 'dt' column (VARCHAR format YYYYMMDD, e.g., '20251218'), this is a PARTITION KEY
       - ALWAYS add WHERE clause with 'dt' filter when possible
       - Date filters MUST use dt column in format: dt = '20251218' or dt BETWEEN '20251201' AND '20251218'
       - For "recent", "latest", "today", "last" queries → use last 2 days
       - For "yesterday" → use appropriate date
       - For specific date range → convert to dt format
       - ⚠️ NEVER query without dt filter unless explicitly asked for "all time" data
    9. If 'datetime' column exists alongside 'dt', use 'dt' for filtering (faster) and 'datetime' for display
    10. Example optimized query: 
        SELECT * FROM orders WHERE dt >= '20251201' AND status = 'completed' LIMIT 100
        yesterday = (datetime.now() - timedelta(days=1)).strftime('%Y%m%d')  -> Yesterday's dt=yesterday 
                          
    Format your response as:
    SQL: [your SQL query here]
    EXPLANATION: [brief explanation including JOIN strategy if applicable]

  # Insights Generation: Analyze results and provide insights
  insights_generation: |
    Analyze query results and generate actionable insights.
    
    Available Information:
    - User Question: {user_question}
    - SQL Query: {sql_query}
    - Data Sample: {data_preview}
    - Schema: {schema_info}
    
    Generate 1-3 key insights that are:
    1. Actionable and specific
    2. Based on actual data patterns
    3. Relevant to the user's question
    4. Easy to understand
    
    Identify patterns such as:
    - Trends (increasing/decreasing over time)
    - Anomalies (unexpected values, outliers)
    - Recommendations (what action to take)
    - Summaries (key takeaways)
    
    Format each insight as:
    TYPE: trend/anomaly/recommendation/summary
    SEVERITY: low/medium/high
    MESSAGE: <concise, actionable insight>
