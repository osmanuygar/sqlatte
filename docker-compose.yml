version: '3.8'

services:
  sqlatte:
    build: .
    ports:
      - "8002:8000"
    environment:
      # Override specific config values via env vars if desired.
      # Prefer editing config/config.yaml (mounted below) instead of
      # storing secrets in this file or .env.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    volumes:
      # config.yaml is the single source of truth — mount read-only.
      # The image itself does NOT contain config/ so secrets are never baked in.
      - ./config:/app/config:ro
    # Drop unnecessary Linux capabilities
    cap_drop:
      - ALL
    # Prevent privilege escalation inside container
    security_opt:
      - no-new-privileges:true
    read_only: false  # Set true if uploads/logs are moved to named volumes
