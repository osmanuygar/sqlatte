# Runs once, only on a brand-new (empty) data volume — the official postgres
# image executes everything under /docker-entrypoint-initdb.d/ on first boot,
# and never again afterwards. Creates the app role + the two databases
# SQLatte needs (analytics.postgresql / config_db.postgresql in config.yaml).
# Table creation itself is left to SQLatte's own runtime
# `CREATE TABLE IF NOT EXISTS` calls — see README "no PostgreSQL init script"
# note — so this only needs to prepare the databases, not the schema.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: sqlatte
data:
  01-create-sqlatte-databases.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE ROLE sqlatte_app WITH LOGIN PASSWORD '${SQLATTE_APP_PASSWORD}';
        CREATE DATABASE sqlatte_analytics OWNER sqlatte_app;
        CREATE DATABASE sqlatte_config OWNER sqlatte_app;
    EOSQL
