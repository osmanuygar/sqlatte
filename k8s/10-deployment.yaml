apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlatte
  namespace: sqlatte
  labels:
    app: sqlatte
spec:
  # Pinned to 1: admin_auth.py and auth_plugin.py hold sessions in-memory,
  # per-process. Raising this (or running >1 gunicorn worker in the
  # container) splits that state across processes — logins would randomly
  # "expire" depending on which process handles the next request. Don't
  # scale this past 1 until sessions move to a shared store (Redis/Postgres).
  replicas: 1
  strategy:
    type: Recreate  # avoid two pods briefly overlapping and splitting sessions during rollout
  selector:
    matchLabels:
      app: sqlatte
  template:
    metadata:
      labels:
        app: sqlatte
    spec:
      containers:
        - name: sqlatte
          image: sqlatte:latest  # replace with your built/pushed image
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          secret:
            secretName: sqlatte-config
