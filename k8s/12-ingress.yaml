# TLS terminates here, at the Ingress — same reasoning as the "reverse proxy
# in front of the app" recommendation in the README/docker-compose setup.
# Requires an ingress controller (e.g. ingress-nginx) and, for automatic
# certs, cert-manager — both cluster-level installs, not covered here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sqlatte
  namespace: sqlatte
  annotations:
    # Uncomment if cert-manager is installed, pointing at a ClusterIssuer:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sqlatte.your-domain.com
      secretName: sqlatte-tls  # created by cert-manager, or `kubectl create secret tls`
  rules:
    - host: sqlatte.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sqlatte
                port:
                  number: 80
